<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Time entry with sync conflict</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Open Sans','Helvetica Neue','Segoe UI',sans-serif;background:#ffffff;color:#111111}
a{color:#1b50d8}a:hover{color:#143d9f}
button,input,select,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 560px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e3e3e3; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,0.12); overflow: hidden; font-size: 14px;">

  <!-- Header -->
  <div style="display: flex; align-items: center; gap: 12px; padding: 20px 24px 12px 24px;">
    <h1 style="margin: 0; flex-grow: 1; font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 700;">Time entry</h1>
    <a href="https://app.clockify.me/tracker" style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; text-decoration: none;">
      Open in Clockify
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 13v7H4V6h7"/></svg>
    </a>
    <a href="Main.dc.html" aria-label="Close" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 6px; color: #5c5c5c;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg>
    </a>
  </div>

  <!-- Conflict banner -->
  <div style="display: flex; gap: 12px; margin: 0 24px; padding: 12px 14px; border-radius: 9px; background: #fdf3f3; border: 1px solid #f1c9c9;">
    <span style="color: #cf5b5b; display: flex; flex-shrink: 0; padding-top: 2px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></span>
    <div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1;">
      <div style="font-weight: 700; color: #8f2f2f;">Changed here and in Clockify since the last sync</div>
      <div style="display: grid; grid-template-columns: 80px minmax(0, 1fr) minmax(0, 1fr); gap: 6px 12px; font-size: 13px;">
        <span style="color: #5c5c5c;"></span>
        <span style="font-weight: 600; color: #5c5c5c;">Here</span>
        <span style="font-weight: 600; color: #5c5c5c;">Clockify</span>
        <span style="color: #5c5c5c;">End</span>
        <span style="font-variant-numeric: tabular-nums;">17:10</span>
        <span style="font-variant-numeric: tabular-nums;">17:25</span>
        <span style="color: #5c5c5c;">Project</span>
        <span>Internal</span>
        <span>Support · Acme</span>
      </div>
      <div style="display: flex; gap: 8px; padding-top: 2px;">
        <button style="height: 32px; padding: 0 12px; border: 0; border-radius: 6px; background: #1b50d8; color: #ffffff; font-size: 13px; font-weight: 600; cursor: pointer;">Keep mine, push to Clockify</button>
        <button style="height: 32px; padding: 0 12px; border: 1px solid #cccccc; border-radius: 6px; background: #ffffff; color: #111111; font-size: 13px; font-weight: 600; cursor: pointer;">Take Clockify's</button>
      </div>
    </div>
  </div>

  <!-- Form -->
  <div style="display: flex; flex-direction: column; gap: 16px; padding: 20px 24px; flex-grow: 1;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="entry-desc" style="font-size: 12px; font-weight: 600; color: #5c5c5c;">Description</label>
      <input id="entry-desc" value="Support tickets" style="height: 40px; padding: 0 12px; border: 1px solid #cccccc; border-radius: 9px; background: #ffffff; font-size: 14px; color: #111111;">
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="entry-project" style="font-size: 12px; font-weight: 600; color: #5c5c5c;">Project</label>
        <div style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid #cccccc; border-radius: 9px; background: #ffffff;">
          <span style="width: 9px; height: 9px; border-radius: 50%; background: #0f9d8a;"></span>
          <select id="entry-project" style="flex-grow: 1; border: 0; background: transparent; font-size: 14px; color: #111111;">
            <option>Internal</option>
            <option>AtomicServer · Ontola</option>
            <option>Calendar app · Acme</option>
            <option>Support · Acme</option>
          </select>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="entry-tags" style="font-size: 12px; font-weight: 600; color: #5c5c5c;">Tags</label>
        <div style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 8px 0 12px; border: 1px solid #cccccc; border-radius: 9px; background: #ffffff;">
          <span style="padding: 2px 8px; border-radius: 999px; background: #f2f2f2; color: #5c5c5c; font-size: 12px;">support</span>
          <input id="entry-tags" placeholder="Add tag" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; font-size: 13px; color: #111111; outline: none;">
        </div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 110px; gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="entry-start" style="font-size: 12px; font-weight: 600; color: #5c5c5c;">Start</label>
        <input id="entry-start" value="Thu 17 Sep, 16:10" style="height: 40px; padding: 0 12px; border: 1px solid #cccccc; border-radius: 9px; background: #ffffff; font-size: 14px; color: #111111; font-variant-numeric: tabular-nums;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="entry-end" style="font-size: 12px; font-weight: 600; color: #5c5c5c;">End</label>
        <input id="entry-end" value="Thu 17 Sep, 17:10" style="height: 40px; padding: 0 12px; border: 1px solid #f1c9c9; border-radius: 9px; background: #fdf3f3; font-size: 14px; color: #111111; font-variant-numeric: tabular-nums;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="entry-duration" style="font-size: 12px; font-weight: 600; color: #5c5c5c;">Duration</label>
        <input id="entry-duration" value="1:00:00" style="height: 40px; padding: 0 12px; border: 1px solid #cccccc; border-radius: 9px; background: #ffffff; font-size: 14px; font-weight: 700; color: #111111; font-variant-numeric: tabular-nums; text-align: right;">
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 24px;">
      <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer;">
        <input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #1b50d8;">
        <span style="font-weight: 700; color: #5c5c5c;">$</span> Billable
      </label>
      <span style="font-size: 13px; color: #5c5c5c;">Person <strong style="color: #111111;">Michiel de Jong</strong></span>
    </div>

    <!-- Sync details -->
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 9px; background: #f7f8fb; font-size: 13px;">
      <div style="display: flex; align-items: center; gap: 8px; font-weight: 700; color: #111111;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1b50d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19a4.5 4.5 0 0 0 .4-9A7 7 0 0 0 4.3 12 4 4 0 0 0 6 19z"/></svg>
        Clockify
      </div>
      <div style="display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 12px; color: #5c5c5c;">
        <span>Workspace</span><span style="color: #111111;">Ontola</span>
        <span>Entry</span><span style="color: #111111; font-family: ui-monospace, Menlo, monospace; font-size: 12px;">68cb3f1e2a9d4c0017e5a9b2</span>
        <span>Last pulled</span><span style="color: #111111;">Today, 14:56</span>
        <span>Last pushed</span><span style="color: #111111;">Thu 17 Sep, 17:12</span>
      </div>
      <div style="display: flex; gap: 12px; padding-top: 4px;">
        <button style="height: 30px; padding: 0 10px; border: 1px solid #cccccc; border-radius: 6px; background: #ffffff; color: #111111; font-size: 12px; font-weight: 600; cursor: pointer;">Pull this entry</button>
        <button style="height: 30px; padding: 0 10px; border: 1px solid #cccccc; border-radius: 6px; background: #ffffff; color: #111111; font-size: 12px; font-weight: 600; cursor: pointer;">Unlink from Clockify</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div style="display: flex; align-items: center; gap: 8px; padding: 14px 24px; border-top: 1px solid #e3e3e3; background: #fafafa;">
    <button style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: #cf5b5b; font-size: 13px; font-weight: 600; cursor: pointer;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>
      Delete
      <span style="font-weight: 400; color: #8a8a8a;">here and in Clockify</span>
    </button>
    <div style="flex-grow: 1;"></div>
    <a href="Main.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 14px; border: 1px solid #cccccc; border-radius: 9px; background: #ffffff; color: #111111; font-size: 13px; font-weight: 600; text-decoration: none;">Cancel</a>
    <button style="height: 36px; padding: 0 16px; border: 0; border-radius: 9px; background: #1b50d8; color: #ffffff; font-size: 13px; font-weight: 600; cursor: pointer;">Save</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":860}}'>

  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
