<div id="app">
  <header class="globalbar"><button class="iconbtn" aria-label="Toggle sidebar" title="Toggle sidebar" onclick="toggleSidebar()" id="sidebar-toggle"></button><div class="crumbs" id="breadcrumbs"></div><div class="right"><span class="smallstatus"><span class="dot"></span> Offline demo</span><button class="iconbtn" title="Reset prototype" aria-label="Reset prototype" onclick="resetDemo()" id="reset-top"></button><button class="iconbtn" title="Share" aria-label="Share" onclick="shareDemo()" id="share-top"></button></div></header>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="s-top"><button class="searchnav" onclick="openCommandPalette()"><span id="search-icon"></span> Search <kbd>⌘ K</kbd></button><button class="drive-switch" onclick="go('drive')"><span id="drive-icon"></span><span class="grow">My Drive</span><span id="switch-chev"></span></button></div>
      <div class="s-scroll"><div class="sidetree" id="tree"></div><div class="s-new"><button class="newmain" onclick="info('New resource','The actual New menu opens resource creation, such as Table, Folder and Document. To discover apps, use your account menu.')">＋ New</button><button class="squick" title="New table" onclick="info('Create table','In the real app this opens the New table flow. This demo focuses on installing a connected app.')" id="quick-table"></button><button class="squick" title="New folder" onclick="info('Create folder','In the real app this creates a normal folder.')" id="quick-folder"></button><button class="squick" title="New document" onclick="info('Create document','In the real app this creates a document.')" id="quick-file"></button></div></div>
      <div class="s-bottom">
        <div class="panelheading"><span>Messages</span><span class="tiny" id="message-icon"></span></div>
        <div class="nomessages">No messages yet</div>
        <div class="account-popup" id="account-popup" role="menu" aria-label="Account and app menu" hidden>
          <button role="menuitem" onclick="accountMenuAction('profile')"><span class="menu-symbol" id="acc-profile-icon"></span>Profile</button>
          <button role="menuitem" onclick="accountMenuAction('notifications')"><span class="menu-symbol" id="acc-bell-icon"></span>Notifications</button>
          <button role="menuitem" onclick="accountMenuAction('apps')" id="account-apps-item"><span class="menu-symbol" id="acc-apps-icon"></span>Apps<span class="menu-help">Discover integrations</span></button>
          <button role="menuitem" onclick="accountMenuAction('sync')"><span class="menu-symbol" id="acc-sync-icon"></span>Sync</button>
          <button role="menuitem" onclick="accountMenuAction('trash')"><span class="menu-symbol" id="acc-trash-icon"></span>Trash</button>
          <button role="menuitem" onclick="accountMenuAction('feedback')"><span class="menu-symbol" id="acc-feedback-icon"></span>Feedback</button>
          <button role="menuitem" onclick="accountMenuAction('about')"><span class="menu-symbol" id="acc-about-icon"></span>About</button>
        </div>
        <div class="userbottom">
          <button class="account-trigger" id="account-trigger" aria-label="Account and app menu" aria-haspopup="menu" aria-controls="account-popup" aria-expanded="false" onclick="toggleAccountMenu()"><span class="roundavatar">M</span><span class="u-label">My account<small>Personal workspace</small></span><span id="account-chevron"></span></button>
          <button class="iconbtn" aria-label="Settings" title="Settings" id="setting-icon" onclick="info('Settings','In Atomic Place, the integration proxy URL can be configured under Settings → Integration.')"></button>
        </div>
      </div>
    </aside>
    <main class="mainarea" id="main"><div class="content" id="content"></div></main>
  </div>

path d="M7 5v4M17 5v4M6 9h12v3a6 6 0 0 1-12 0V9ZM12 18v4"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M19 13.5 21 12l-2-1.5.3-2.5-2.5-.6-1.3-2.2-2.5 1-2.5-1-1.3 2.2-2.5.6.3 2.5L5 12l2 1.5-.3 2.5 2.5.6 1.3 2.2 2.5-1 2.5 1 1.3-2.2 2.5-.6z"/>',external:'<path d="M13 5h6v6M19 5l-9 9M19 13v6H5V5h6"/>',file:'<path d="M7 3h7l5 5v13H5V3zM14 3v5h5M8 13h8M8 17h8"/>',arrow:'<path d="M5 12h14m-7-7 7 7-7 7"/>',arrowleft:'<path d="M19 12H5m7 7-7-7 7-7"/>',shield:'<path d="M12 2 21 6v6c0 5-3.5 8-9 10-5.5-2-9-5-9-10V6z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="1"/><path d="M16 8V4H4v12h4"/>',filter:'<path d="M3 5h18l-7 8v6l-4-2v-4z"/>',sort:'<path d="M8 6h12M8 12h8M8 18h4"/>'};
function ic(name,size=''){return `<svg class="icon ${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.info}</svg>`}
function btn(label,action,variant='',attrs=''){return `<button class="btn ${variant}" data-action="${h(action)}" ${attrs}>${label}</button>`}
function mirrorKey(){return `${S.owner}/${S.repo}/issues`}
function isMirrored(){return !!S.mirrors[mirrorKey()]}
function githubIcon(size=''){return ic('github',size)}
function crumbPath(){return (PATHS[S.page]||['My Drive']).map(x=>x==='@owner'?S.owner:x==='@repo'?S.repo:x)}
function activate(page){S.page=page;if(!['platform','organizations','repositories','issues'].includes(page))S.tab='';render()}
function go(page){if(page==='platform'&&!S.installed){activate('apps');return}if(!S.connected&&['account','organizations','owner','repositories','repo','issues'].includes(page)){activate('platform');return}if(page==='issues'&&!isMirrored()){activate('repo');return}activate(page)}
function setOwner(owner){S.owner=owner;S.repo=(OWNERS.find(o=>o.id===owner)||OWNERS[0]).repos[0];go('owner')}
function setRepo(repo){S.repo=repo;go('repo')}
function setTab(tab){S.tab=tab;render()}
function getTab(){return S.tab||({'platform':'Accounts','organizations':'Collections','repositories':'Collections','issues':'Sync'}[S.page]||'')}
function install(){S.installed=true;S.tab='Accounts';toast('GitHub added to My Drive');go('platform')}
function startSync(){S.mirrors[mirrorKey()]=true;S.paused[mirrorKey()]=false;S.lastSync[mirrorKey()]='Just now';S.tab='Sync';toast('Issues table created and linked to GitHub');go('issues')}
function syncNow(){if(S.paused[mirrorKey()]){toast('Resume this mirror to sync again');return}S.lastSync[mirrorKey()]='Just now';toast('Sync complete · No changes');render()}
function togglePause(){S.paused[mirrorKey()]=!S.paused[mirrorKey()];toast(S.paused[mirrorKey()]?'Mirroring paused. Local rows were kept.':'Mirroring resumed.');render()}
function gotoIssues(){S.tab='Sync';go('issues')}
function resName(page){return {'platform':'GitHub','account':'michiel','organizations':'Organizations','owner':S.owner,'repositories':'Repositories','repo':S.repo,'issues':'Issues'}[page]||''}
function title(name,icon='table',end=''){return `<div class="resource-header"><span class="resicon">${ic(icon,'xl')}</span><h1 class="resname">${h(name)}</h1><div class="push"></div>${end}<button class="iconbtn" aria-label="Resource menu" title="Resource menu" onclick="resourceMenu()">${ic('more')}</button></div>`}
function tbar(tabs,active){return `<div class="tabsline" role="tablist">${tabs.map(t=>`<button role="tab" aria-selected="${t===active}" class="viewtab ${t===active?'active':''}" onclick="setTab('${h(t)}')">${ic(t==='Table'?'table':t==='Sync'?'refresh':'grid')} ${h(t)}</button>`).join('')}<button class="viewtab" title="Add a view" onclick="info('Add view','In Atomic Place this opens the menu for adding Table, Calendar, Kanban or app views.')">${ic('plus')}</button><div class="viewright"><button class="iconbtn" title="Filter" onclick="info('Filter','Filters would apply to the current Atomic table view.')">${ic('filter')}</button><button class="iconbtn" title="Columns" onclick="info('Columns','The real table editor lets you show and hide columns.')">${ic('table')}</button></div></div>`}
function grid(headers,rows){return `<div style="overflow:auto"><table class="native-grid"><thead><tr>${headers.map(x=>`<th>${h(x)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function rowcells(cells){return `<tr>${cells.map(c=>`<td>${c}</td>`).join('')}</tr>`}
function plainTable(){switch(S.page){case 'platform':return grid(['Name','Connection','Status'],S.connected?[rowcells([`<button class="btn ghost small" onclick="go('account')">${ic('user')} michiel</button>`,'GitHub','Connected'])]:[]);case 'organizations':return grid(['Name','Kind','Repositories'],OWNERS.map(o=>rowcells([`<button class="btn ghost small" onclick="setOwner('${o.id}')">${h(o.name)}</button>`,h(o.kind),String(o.repos.length)])));case 'repositories':return grid(['Name','Owner','Mirrored collections'],OWNERS.find(o=>o.id===S.owner).repos.map(r=>rowcells([`<button class="btn ghost small" onclick="setRepo('${r}')">${h(r)}</button>`,h(S.owner),S.mirrors[`${S.owner}/${r}/issues`]?'Issues':'—'])));case 'issues':return grid(['Issue','Title','State','Updated'],(ISSUES[S.repo]||ISSUES['atomic-server']).map(a=>rowcells([`<span style="color:#666">${h(a[0])}</span>`,h(a[1]),`<span class="chip ${a[2]==='Open'?'green':''}">${h(a[2])}</span>`,h(a[3])])));default:return ''}}
function contentApps(){const items=[{id:'github',name:'GitHub',description:'Browse organizations, repositories and sync issues.',symbol:githubIcon('lg'),klass:'github'},{id:'notion',name:'Notion',description:'Connect pages and databases to your drive.',symbol:'N',klass:'notion'},{id:'google-calendar',name:'Google Calendar',description:'Mirror calendars and events into tables.',symbol:'31',klass:'calendar'},{id:'todoist',name:'Todoist',description:'Connect task lists to Atomic Place.',symbol:'✓',klass:'todoist'},{id:'airtable',name:'Airtable',description:'Sync bases and tables to your drive.',symbol:ic('grid','lg'),klass:'calendar'},{id:'google-tasks',name:'Google Tasks',description:'Connect task lists from Google.',symbol:'✓',klass:'calendar'}];const q=S.query.trim().toLowerCase();let visible=items.filter(x=>(x.name+' '+x.description).toLowerCase().includes(q));return `<div class="headingicon">${ic('plug','xl')}</div><h1 class="pagetitle">Apps</h1><p class="pagedesc">Install apps into your drive, connect integrations and keep your work in sync. Add automations when you need them.</p><div class="feature"><strong>New</strong><span>This is a new feature. You are seeing experimental apps to try out.</span></div><div class="headingrow" style="align-items:center"><h2 class="sectionheading" style="margin:10px 0">Your automations</h2>${btn(`${ic('plus')} New automation`,'automation','subtle small')}</div><p class="muted" style="font-size:13px;margin:5px 0 24px">No automations yet. Create one to respond to events from your connected apps.</p><h2 class="sectionheading">Discover apps</h2><input class="input" aria-label="Search apps" id="appsearch" placeholder="Search apps, integrations, domains or standards" value="${h(S.query)}" oninput="searchApps(this.value)" /><label class="experimental"><input type="checkbox" ${S.experimental?'checked':''} onchange="S.experimental=this.checked;render()" /> Show experimental apps</label><div class="headingrow" style="margin-top:14px;align-items:end"><div><h3 style="margin:0 0 5px;font-size:15px">Integrations</h3><p class="muted" style="font-size:12px;margin:0 0 13px">Services available through the configured integration proxy</p></div><span class="dim" style="margin-bottom:13px">integrations.atomic.place</span></div><div class="tilegrid">${visible.map(x=>`<div class="tile"><div class="tilehead"><div class="brandicon ${x.klass}">${x.symbol}</div><span class="dim">Integration</span></div><div><h3>${x.name}</h3><p>${x.description}</p></div><div class="tilefoot">${x.id==='github'?(S.installed?btn('Open','platform','small'):`<button class="btn small" onclick="install()">Install</button>`):btn('Preview','preview-'+x.id,'subtle small')}</div></div>`).join('')||'<p>No matching integrations.</p>'}</div>${S.experimental?`<div class="divider"></div><h2 class="sectionheading" style="margin-top:14px">Drive apps</h2><p class="muted" style="font-size:12px;margin:-6px 0 14px">Apps that run in their own iframe. These can be independently published and versioned.</p><div class="tilegrid">${[{n:'Google Keep',d:'Sync notes and lists',v:'0.1.0',s:'📝'},{n:'Pets',d:'Demo provider and pet import',v:'0.1.6',s:'🐾'},{n:'Google Keep View',d:'Card and checklist view',v:'0.2.0',s:'☑'}].map(x=>`<div class="tile" style="min-height:145px"><div class="tilehead"><div class="brandicon pets">${x.s}</div><span class="dim">Version ${x.v}</span></div><div><h3>${x.n}</h3><p>${x.d}</p></div><div class="tilefoot">${btn('Install','thirdparty','subtle small')}</div></div>`).join('')}</div>`:''}`}
function contentDrive(){return `${title('My Drive','folder')}<p class="resourcesub">Your resources in this drive.</p>${grid(['Name','Type','Modified'],[...(S.installed?[rowcells([`<button class="btn ghost small" onclick="go('platform')">${githubIcon()} GitHub</button>`,'Table · Accounts','Just now'])]:[]),...Object.keys(S.mirrors).map(key=>rowcells([`<button class="btn ghost small" onclick="openMirror('${h(key)}')">${ic('table')} Issues</button>`,`Mirrored table${S.moved[key]?' · Moved':''}`,'Just now']))])}<div class="tagnote" style="margin-top:16px">To discover apps, open My account → Apps. Platform tables live in the current drive root. Collection and mirror identities stay stable if you move or link them elsewhere.</div>`}
function contentPlatform(){const connected=S.connected;return `${title('GitHub','table',connected?'<span class="chip green">Connected</span>':'')}${tbar(['Accounts','Table'],getTab())}<p class="resourcesub">Accounts connected through GitHub’s integration proxy.</p>${getTab()==='Table'?plainTable():frame('accounts')}`}
function contentAccount(){return `${title('michiel','user')}<p class="resourcesub">GitHub account · Connection through integrations.atomic.place</p><div class="resource-pills"><span class="chip green">${ic('check','sm')} Connected</span><span class="chip">Authentication managed by integration proxy</span></div><div class="inline-list"><div>${ic('table')} <strong style="margin-left:8px">Organizations</strong><div class="tinylabel" style="margin-left:26px">Organizations and personal repository namespaces accessible to this account</div></div>${btn('Open','organizations','subtle small')}</div><div class="resourcecard"><h3>Connected account</h3><dl class="resource-info"><dt>Provider</dt><dd>GitHub</dd><dt>Connected as</dt><dd>michiel</dd><dt>Connection</dt><dd>Managed by the integration proxy</dd><dt>Next step</dt><dd>Browse organizations and owner namespaces</dd></dl></div>`}
function contentOrganizations(){return `${title('Organizations','table')}${tbar(['Collections','Table'],getTab())}<p class="resourcesub">Organizations and personal owner namespaces accessible to michiel.</p>${getTab()==='Table'?plainTable():frame('organizations')}`}
function contentOwner(){const o=OWNERS.find(x=>x.id===S.owner);return `${title(o.name,o.kind==='Organization'?'users':'user')}<p class="resourcesub">${h(o.kind)} · GitHub owner namespace</p><div class="resource-pills"><span class="chip">Accessible from michiel</span><span class="chip">${o.repos.length} repositories</span></div><div class="inline-list"><div>${ic('table')} <strong style="margin-left:8px">Repositories</strong><div class="tinylabel" style="margin-left:26px">Repositories belonging to ${h(o.name)}</div></div>${btn('Open','repositories','subtle small')}</div><div class="resourcecard"><h3>Owner</h3><p>Repository identity and location are tied to the owning ${o.kind==='Organization'?'organization':'personal owner namespace'}, not the account used to authenticate.</p></div>`}

function contentRepo(){return `${title(S.repo,'folder')}<p class="resourcesub">GitHub repository · ${h(S.owner)}/${h(S.repo)}</p><div class="resource-pills"><span class="chip">Owner: ${h(S.owner)}</span><span class="chip">Collection types</span></div><h2 class="sectionheading">Available collections</h2><div class="recordcard"><div><div class="bodylabel">${ic('table')} Issues</div><div class="tinylabel" style="margin-top:5px">Issues belonging to ${h(S.owner)}/${h(S.repo)}</div></div>${isMirrored()?btn('Open existing table','issues','small'):btn('Create and sync table','createIssues','small')}</div><div class="recordcard"><div><div class="bodylabel">${ic('table')} Pull requests</div><div class="tinylabel" style="margin-top:5px">Separate collection type</div></div>${btn('Not in demo','later','subtle small')}</div><div class="tagnote" style="margin-top:18px">A collection mirror is created only when you choose it. Browsing a repository does not automatically start syncing all its descendants.</div>`}
function contentIssues(){let paused=S.paused[mirrorKey()];return `${title('Issues','table',`<span class="chip ${paused?'':'green'}">${paused?'Paused':'Synced'}</span>`)}${tbar(['Table','Sync'],getTab())}<p class="resourcesub">GitHub · ${h(S.owner)}/${h(S.repo)} · Mirrored collection${S.moved[mirrorKey()]?' · Moved in this drive':''}</p>${getTab()==='Table'?plainTable():frame('issues')}`}
function content(){switch(S.page){case 'apps':return contentApps();case 'drive':return contentDrive();case 'platform':return contentPlatform();case 'account':return contentAccount();case 'organizations':return contentOrganizations();case 'owner':return contentOwner();case 'repositories':return contentRepositories();case 'repo':return contentRepo();case 'issues':return contentIssues();default:return contentDrive()}}

function frameText(type){const common=`<style>:root{--main:#1b50d8}*{box-sizing:border-box}body{margin:0;padding:3px 1px 30px;background:white;color:#111;font:13px/1.5 'Open Sans','Helvetica Neue','Segoe UI',Arial,sans-serif}button{cursor:pointer;font:inherit}.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:8px 0 12px}.btn{background:#1b50d8;border:1px solid #1b50d8;border-radius:9px;color:#fff;min-height:32px;padding:6px 12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.btn.ghost{background:#fff;border-color:#ddd;color:#555}.btn:hover{filter:brightness(1.06)}.subtitle{color:#777;font-size:12px;margin:3px 0 14px}.status{display:inline-flex;gap:6px;align-items:center;background:#e6f4e9;color:#27633e;border-radius:6px;font-size:12px;padding:3px 7px}.status.off{background:#f1f1f1;color:#666}.status .dot{width:6px;height:6px;background:currentColor;border-radius:50%}.status.pending{background:#fff0df;color:#966529}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #e3e3e3;text-align:left;padding:8px 11px;min-height:39px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}th{background:#f9f9f9;color:#666;font-weight:650}tr:hover td{background:#fbfbfb}.link{color:#1b50d8;font-weight:600;border:none;background:transparent;padding:0}.link:hover{text-decoration:underline}.empty{text-align:center;padding:36px 16px;border:1px dashed #d2d2d2;border-radius:9px;max-width:100%}.empty h3{margin:6px 0;font-size:16px}.empty p{margin:0 auto 18px;color:#777;max-width:420px}.empty .big{font-size:27px;color:#777}.hint{color:#888;font-size:12px;margin-top:12px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}.card{padding:15px;border:1px solid #ddd;border-radius:8px}.card strong{font-size:20px;display:block}.card small{font-size:12px;color:#777}.source{padding:12px;border:1px solid #e2e2e2;border-radius:8px;margin:15px 0}.kv{display:grid;grid-template-columns:160px 1fr;gap:6px;font-size:12px}.kv dt{color:#777}.kv dd{margin:0}.rowcontrols{display:flex;gap:8px;align-items:center;justify-content:flex-start}.muted{color:#777}.intro{margin:6px 0 10px;color:#777}.warning{margin:10px 0;padding:10px 13px;background:#fff7ed;border:1px solid #f2dbb5;border-radius:8px;color:#87612e;font-size:12px}@media(max-width:680px){.cards{grid-template-columns:1fr}.kv{grid-template-columns:1fr}} </style>`;

switch(type){case 'accounts':body=S.connected?`<div class="toolbar"><div class="subtitle">One connected account</div>${b('+ Connect account','connect','ghost')}</div><table><thead><tr><th style="width:40%">Name</th><th>Connection</th><th style="width:27%">Actions</th></tr></thead><tbody><tr><td>${l('michiel','account')}</td><td><span class="status"><i class="dot"></i> Connected</span></td><td>${l('Browse organizations','organizations')}</td></tr></tbody></table><p class="hint">A connection grants access to organizations; those organizations remain independent remote resources.</p>`:`<div class="empty"><div class="big">◉</div><h3>No GitHub accounts connected</h3><p>Connect an account to discover organizations and the repositories you can access.</p>${b('Connect GitHub account','connect')}</div>`;break;
case 'organizations':body=`<div class="toolbar"><span class="subtitle">3 owner namespaces available to this connection</span>${b('↻ Refresh list','refresh','ghost')}</div><table><thead><tr><th>Name</th><th>Kind</th><th style="width:110px">Repositories</th><th style="width:96px">Action</th></tr></thead><tbody>${OWNERS.map(o=>`<tr><td>${l(o.name,'owner',o.id)}</td><td>${h(o.kind)}</td><td>${o.repos.length}</td><td>${l('Open','owner',o.id)}</td></tr>`).join('')}</tbody></table><p class="hint">“michiel” is a personal owner namespace, not an actual GitHub Organization object.</p>`;break;
case 'repositories':{const owner=OWNERS.find(o=>o.id===S.owner);body=`<div class="toolbar"><span class="subtitle">${owner.repos.length} repositories owned by ${h(S.owner)}</span>${b('↻ Refresh list','refresh','ghost')}</div><table><thead><tr><th>Repository</th><th style="width:160px">Owner</th><th style="width:148px">Issue mirror</th><th style="width:96px">Action</th></tr></thead><tbody>${owner.repos.map(r=>`<tr><td>${l(r,'repo',r)}</td><td>${h(owner.id)}</td><td>${S.mirrors[`${owner.id}/${r}/issues`]?'<span class="status"><i class="dot"></i> Active</span>':'<span class="status off">Not mirrored</span>'}</td><td>${l('Open','repo',r)}</td></tr>`).join('')}</tbody></table><p class="hint">Repositories belong to their owner, not to the login used to discover them.</p>`;break;}
case 'issues':{const rows=ISSUES[S.repo]||ISSUES['atomic-server'];const paused=S.paused[mirrorKey()];const last=S.lastSync[mirrorKey()]||'Just now';body=`<div class="toolbar"><span class="subtitle">Mirror: ${h(S.owner)}/${h(S.repo)} / Issues</span><div class="rowcontrols">${b('↻ Sync now','syncNow')}${b(paused?'▶ Resume':'Ⅱ Pause','pause','ghost')}</div></div><div class="cards"><div class="card"><strong>${rows.length}</strong><small>Rows in table</small></div><div class="card"><strong>${paused?'Paused':'Up to date'}</strong><small>Synchronization</small></div><div class="card"><strong style="font-size:16px">${h(last)}</strong><small>Last successful sync</small></div></div><div class="source"><div class="toolbar" style="margin:0"><strong style="font-size:13px">Source connection</strong>${b('Source details','source','ghost')}</div><p class="intro">GitHub · Account michiel · Read-only · Requests through integration proxy</p><span class="status ${paused?'off':''}"><i class="dot"></i> ${paused?'Mirroring paused':'Browser-driven synchronization active'}</span></div><div class="toolbar">${b('Move table…','move','ghost')}${b('Link elsewhere…','link','ghost')}<span class="muted" style="margin-left:auto;font-size:12px">${rows.length} items stay in Atomic when paused</span></div>`;break;}
}return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">${common}</head><body>${body}<script>document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;parent.postMessage({type:'atomic-syncables-demo',action:el.dataset.action,arg:el.dataset.arg||''},'*')});parent.postMessage({type:'atomic-syncables-ready'},'*')<\/script></body></html>`}
function afterRender(){const frameEl=document.getElementById('syncframe');if(frameEl){frameEl.srcdoc=frameText(({platform:'accounts',organizations:'organizations',repositories:'repositories',issues:'issues'})[S.page])}}
function searchApps(value){S.query=value;const active=document.activeElement;const pos=active&&active.selectionStart;document.getElementById('content').innerHTML=content();const inp=document.getElementById('appsearch');if(inp){inp.focus();if(pos!==null&&pos!==undefined)inp.setSelectionRange(pos,pos)} }
function renderBreadcrumbs(){const path=crumbPath();let i=0;document.getElementById('breadcrumbs').innerHTML=path.map((label,j)=>{let target='drive';if(label==='Apps')target='apps';else if(label==='GitHub')target='platform';else if(label==='michiel'&&j<3)target='account';else if(label==='Organizations')target='organizations';else if(label==='Repositories')target='repositories';else if(label==='Issues')target='issues';else if(label===S.owner)target='owner';else if(label===S.repo)target='repo';const end=j===path.length-1;return `${j?'<span class="sep">›</span>':''}<button class="crumbitem ${end?'current':''}" onclick="go('${target}')" ${end?'aria-current="page"':''}>${h(label)}</button>`}).join('')}
function renderSidebar(){const tr=[];if(S.installed){tr.push({l:'GitHub',ico:'table',p:'platform',depth:0});if(S.connected){tr.push({l:'michiel',ico:'user',p:'account',depth:1});tr.push({l:'Organizations',ico:'table',p:'organizations',depth:2});if(['owner','repositories','repo','issues'].includes(S.page)){tr.push({l:S.owner,ico:'users',p:'owner',depth:3});tr.push({l:'Repositories',ico:'table',p:'repositories',depth:4});if(['repo','issues'].includes(S.page)){tr.push({l:S.repo,ico:'folder',p:'repo',depth:5});if(isMirrored()){tr.push({l:'Issues',ico:'table',p:'issues',depth:6})}}}}}
document.getElementById('tree').innerHTML=tr.map(x=>`<button class="sideentry ${S.page===x.p?'sel':''}" style="padding-left:${7+x.depth*13}px" onclick="go('${x.p}')">${ic(x.ico)}<span class="txt">${h(x.l)}</span></button>`).join('')}
function render(){closeAccountMenu();renderBreadcrumbs();renderSidebar();document.getElementById('content').className='content'+(S.page!=='apps'?' wide':'');document.getElementById('content').innerHTML=content();afterRender();document.getElementById('main').scrollTop=0}
function toast(text){const box=document.getElementById('toasts');const id='t'+Math.random().toString(36).slice(2);box.insertAdjacentHTML('beforeend',`<div class="toast" id="${id}">${ic('check')}<span>${h(text)}</span><button onclick="document.getElementById('${id}').remove()" title="Dismiss">×</button></div>`);setTimeout(()=>document.getElementById(id)?.remove(),3800)}
function modal(content){document.getElementById('modalMount').innerHTML=`<div class="overlay" role="presentation" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${content}</div></div>`}
function closeModal(){document.getElementById('modalMount').innerHTML=''}
function closeAccountMenu(){const popup=document.getElementById('account-popup');const trigger=document.getElementById('account-trigger');if(popup)popup.hidden=true;if(trigger)trigger.setAttribute('aria-expanded','false')}
function toggleAccountMenu(){const popup=document.getElementById('account-popup');const trigger=document.getElementById('account-trigger');const wasClosed=popup.hidden;popup.hidden=!wasClosed;trigger.setAttribute('aria-expanded',String(wasClosed));if(wasClosed)popup.querySelector('button')?.focus()}
function accountMenuAction(action){closeAccountMenu();if(action==='apps')go('apps');else info(action.charAt(0).toUpperCase()+action.slice(1),'The real Atomic Place account menu includes this destination. This prototype concentrates on Apps and GitHub mirroring.')}
function openCommandPalette(){closeAccountMenu();modal(`<div class="modalheader"><h2>Search</h2><button class="iconbtn" onclick="closeModal()" aria-label="Close search">×</button></div><input class="input" id="command-search" aria-label="Search commands" oninput="filterCommandPalette(this.value)" placeholder="Search resources and actions" autocomplete="off"><div class="tinylabel" style="margin:18px 0 6px">Apps · planned contextual discovery</div><div id="command-results"><button class="cmd-item" onclick="closeModal();go('apps')">${ic('plug')} Apps <small>Discover apps and integrations</small></button><button class="cmd-item" onclick="closeModal();go('drive')">${ic('folder')} My Drive</button></div>`);document.getElementById('command-search')?.focus()}
function filterCommandPalette(value){const q=value.trim().toLowerCase();document.querySelectorAll('#command-results .cmd-item').forEach(item=>item.hidden=!item.textContent.toLowerCase().includes(q))}
function info(name,body){modal(`<div class="modalheader"><h2>${h(name)}</h2><button class="iconbtn" onclick="closeModal()">×</button></div><p>${h(body)}</p><div class="foot">${btn('Close','close','small')}</div>`)}
function resourceMenu(){modal(`<div class="modalheader"><h2>${h(resName(S.page)||'Resource')} · menu</h2><button class="iconbtn" onclick="closeModal()">×</button></div><div class="inline-list"><strong>Share</strong>${btn('Open','share','subtle small')}</div><div class="inline-list"><strong>Move</strong>${btn('Move…','move','subtle small')}</div><div class="inline-list"><strong>Link elsewhere</strong>${btn('Link…','link','subtle small')}</div><div class="foot">${btn('Close','close','subtle small')}</div>`)}
function oauth(){S.oauth=1;showOauth()}
function showOauth(){const cancel=`<button class="btn ghost" onclick="closeModal()">Cancel</button>`;let content='';if(S.oauth===1){content=`<div class="modalheader">${githubIcon('lg')}<h2>Connect GitHub</h2><button class="iconbtn" onclick="closeModal()">×</button></div><p>Connect your GitHub account to discover organizations, repositories and issues you can sync into this drive.</p><div class="resourcecard"><strong style="font-size:13px">Connection</strong><p style="margin-top:5px">The integration proxy manages GitHub authorization and keeps your credentials. Atomic Place accesses the API through scoped permissions.</p></div><div class="foot">${cancel}<button class="btn" onclick="S.oauth=2;showOauth()">Continue to proxy ${ic('arrow')}</button></div>`}else if(S.oauth===2){content=`<div class="oauth-site"><div class="oauth-url">${ic('shield')} https://integrations.atomic.place/connect</div><div class="oauth-body"><h3>Connect your GitHub account</h3><p>Allow Atomic Place to read your accessible organizations and repositories through this integration proxy.</p><div class="tagnote">This is a simulated authorization page. No credentials are requested.</div><div class="foot">${cancel}<button class="btn" onclick="S.oauth=3;showOauth()">Continue to GitHub ${ic('external')}</button></div></div></div>`}else{content=`<div class="oauth-site"><div class="oauth-url">${githubIcon('sm')} https://github.com/login/oauth/authorize</div><div class="oauth-body"><div style="text-align:center;margin-bottom:15px">${githubIcon('xl')}</div><h3>Authorize access</h3><p style="margin-bottom:9px">Choose which GitHub account to connect to Atomic Place.</p><button class="choice sel" onclick="void(0)"><span class="roundavatar">M</span><span><strong>michiel</strong><small>Personal GitHub account</small></span><span style="margin-left:auto;color:#1b50d8">✓</span></button><div class="foot">${cancel}<button class="btn" onclick="finishOAuth()">Authorize and return</button></div></div></div>`}modal(content)}
function finishOAuth(){closeModal();S.connected=true;S.tab='';toast('GitHub account connected');go('account')}
function sourceDetails(){modal(`<div class="modalheader"><h2>Source details</h2><button class="iconbtn" onclick="closeModal()">×</button></div><p>The mirror stays connected even if you move or link its Atomic table.</p><dl class="resource-info" style="max-width:none"><dt>Platform</dt><dd>github-issues</dd><dt>Connected account</dt><dd>michiel</dd><dt>Provider owner</dt><dd>${h(S.owner)}</dd><dt>Repository</dt><dd>${h(S.repo)}</dd><dt>Collection type</dt><dd>Issues</dd><dt>Sync direction</dt><dd>Remote → Atomic (read only)</dd><dt>Proxy</dt><dd>integrations.atomic.place</dd><dt>View runtime</dt><dd>Built-in module in sandboxed iframe</dd></dl><div class="foot">${btn('Close','close','small')}</div>`)}
function moveOrLink(kind){const key=mirrorKey();modal(`<div class="modalheader"><h2>${kind==='move'?'Move':'Link'} Issues table</h2><button class="iconbtn" onclick="closeModal()">×</button></div><p>${kind==='move'?'Choose a new location for the Atomic table. Its GitHub source binding will not change.':'Add a reference to this mirror from another place in your drive.'}</p><div class="choice" style="cursor:default">${ic('folder')} <span><strong>My Drive / Project notes</strong><small>Example destination</small></span></div><div class="foot">${btn('Cancel','close','subtle small')}<button class="btn" onclick="finishMove('${kind}')">${kind==='move'?'Move here':'Create link'}</button></div>`)}
function finishMove(kind){closeModal();const key=mirrorKey();if(kind==='move')S.moved[key]=true;else S.links[key]=true;toast(kind==='move'?'Table moved · GitHub source preserved':'Link created · One shared mirror');render()}
function openMirror(key){const [owner,repo]=key.split('/');S.owner=owner;S.repo=repo;gotoIssues()}
function shareDemo(){info('Share prototype','This is an offline interactive demonstration. Use the provided HTML file to share this mock flow. No Atomic resources are created.')}
function resetDemo(){modal(`<div class="modalheader"><h2>Restart prototype?</h2><button class="iconbtn" onclick="closeModal()">×</button></div><p>Return to My Drive and clear the simulated GitHub connection and tables.</p><div class="foot">${btn('Cancel','close','subtle small')}<button class="btn" onclick="Object.assign(S,{page:'drive',installed:false,connected:false,account:'michiel',owner:'ontola',repo:'atomic-server',tab:'',experimental:true,mirrors:{},paused:{},lastSync:{},moved:{},links:{},query:''});closeModal();render()">Restart</button></div>`)}
function toggleSidebar(){closeAccountMenu();S.sidebar=!S.sidebar;document.getElementById('sidebar').style.display=S.sidebar?'':'none'}
function handle(action,arg=''){switch(action){case 'close':closeModal();break;case 'account':go('account');break;case 'organizations':go('organizations');break;case 'repositories':go('repositories');break;case 'platform':go('platform');break;case 'owner':setOwner(arg);break;case 'repo':setRepo(arg);break;case 'issues':gotoIssues();break;case 'connect':oauth();break;case 'refresh':toast('Listing refreshed · No changes');break;case 'syncNow':syncNow();break;case 'pause':togglePause();break;case 'source':sourceDetails();break;case 'move':moveOrLink('move');break;case 'link':moveOrLink('link');break;case 'createIssues':startSync();break;case 'automation':info('New automation','Automations are out of scope for this GitHub connection prototype.');break;case 'thirdparty':info('Drive app installation','Published drive apps continue using their own integrity-verified JS bundles. This demo focuses on the built-in Syncables flow.');break;case 'later':info('Not mirrored yet','The demo demonstrates GitHub Issues. Other collection types would use the same Syncables architecture.');break;case 'share':shareDemo();break;default:if(action.startsWith('preview-'))info('Integration preview','Only GitHub onboarding is simulated in this prototype. Other integrations share the same interface.')}}
document.addEventListener('click',e=>{if(!e.target.closest('#account-popup')&&!e.target.closest('#account-trigger'))closeAccountMenu();const el=e.target.closest('[data-action]');if(el){handle(el.dataset.action,el.dataset.arg||'')}});
window.addEventListener('message',e=>{const frame=document.getElementById('syncframe');if(!frame||e.source!==frame.contentWindow||!e.data||e.data.type!=='atomic-syncables-demo')return;const allowed=['account','organizations','owner','repo','refresh','connect','syncNow','pause','source','move','link'];if(allowed.includes(e.data.action))handle(e.data.action,e.data.arg)});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeAccountMenu()}if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openCommandPalette()}});
document.getElementById('sidebar-toggle').innerHTML=ic('menu');document.getElementById('reset-top').innerHTML=ic('refresh');document.getElementById('share-top').innerHTML=ic('link');document.getElementById('search-icon').innerHTML=ic('search');document.getElementById('drive-icon').innerHTML=ic('folder');document.getElementById('switch-chev').innerHTML=ic('updown','sm');document.getElementById('account-chevron').innerHTML=ic('updown','sm');document.getElementById('quick-table').innerHTML=ic('table');document.getElementById('quick-folder').innerHTML=ic('folder');document.getElementById('quick-file').innerHTML=ic('file');document.getElementById('setting-icon').innerHTML=ic('gear');document.getElementById('message-icon').innerHTML=ic('plus');for(const [id,icon] of Object.entries({'acc-profile-icon':'user','acc-bell-icon':'bell','acc-apps-icon':'plug','acc-sync-icon':'refresh','acc-trash-icon':'trash','acc-feedback-icon':'message','acc-about-icon':'info'})){document.getElementById(id).innerHTML=ic(icon)}
render();
</script>
</body></html>
