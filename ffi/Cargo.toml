[package]
name = "atomic-ffi"
version = "0.1.0"
edition = "2021"
description = "UniFFI bindings for atomic_lib — Kotlin (and later Swift)"
license = "MIT"
publish = false

[lib]
name = "atomic_ffi"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
atomic_lib = { path = "../lib", default-features = false, features = [
    "db-redb",
    "iroh",
    "discovery",
] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
uniffi = { version = "0.29", features = ["cli"] }

[dev-dependencies]
tempfile = "3"
