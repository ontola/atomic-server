on: [push, workflow_dispatch]

# Which machine the Linux jobs run on is a repository variable, not a literal,
# so switching between the self-hosted runner and GitHub's takes one settings
# change instead of an edit to every workflow.
#
#   Settings -> Secrets and variables -> Actions -> Variables
#   CI_RUNNER = ["self-hosted", "Linux", "X64"]
#
# Unset or delete it and everything falls back to `ubuntu-latest`. There is no
# automatic failover: if the self-hosted runner is offline, jobs QUEUE (GitHub
# gives up after 24h) rather than moving to a hosted runner. Clearing
# CI_RUNNER is the manual escape hatch.
#
# SECURITY: this repo is public, and self-hosted runners must never run
# untrusted code. That is safe today only because nothing here triggers on
# `pull_request`/`pull_request_target` -- every trigger is push,
# workflow_dispatch or workflow_call, all of which need write access. Adding a
# pull_request trigger while CI_RUNNER points at a self-hosted machine would
# let any fork execute arbitrary code on it.

name: "Main pipeline: build, lint, test"
jobs:
  Main:
    name: Main
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    env:
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v2
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: joepmeneer
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: joepmeneer/atomic-server
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Dagger CI (test, lint, build)
        uses: dagger/dagger-for-github@8.0.0
        with:
          version: "latest"
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          verb: call
          args: ci --netlify-auth-token env://NETLIFY_TOKEN
      - name: Dagger docker images (build images & publish)
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: dagger/dagger-for-github@8.0.0
        with:
          version: "latest"
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          verb: call
          args: create-docker-images --tags ${{ steps.meta.outputs.tags }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ./artifact
