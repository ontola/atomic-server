# Actual Tauri/WebKitGTK recovery with a real Iroh peer and SaaS/MinIO.
# Called by Main on trusted refs only; no production account or storage secrets.
name: Native file recovery

on:
  workflow_call:
    secrets:
      ATOMIC_SAAS_DISPATCH_TOKEN:
        description: Read-only access to the private Cloud Vault implementation
        required: true

permissions:
  contents: read

jobs:
  recovery:
    name: Native peer and Cloud Vault recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Require a trusted caller
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$CALLER_REPOSITORY" = ontola/atomic-server
          case "$CALLER_EVENT" in
            push|workflow_dispatch) ;;
            *) echo 'Native Vault recovery requires a trusted push or dispatch.' >&2; exit 1 ;;
          esac

      - name: Checkout Atomic Server at the tested commit
        uses: actions/checkout@v4
        with:
          path: atomic-server
          persist-credentials: false

      - name: Resolve the paired Cloud Vault revision
        id: saas
        env:
          GH_TOKEN: ${{ secrets.ATOMIC_SAAS_DISPATCH_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'ATOMIC_SAAS_DISPATCH_TOKEN is required for real Cloud Vault recovery.' >&2
            exit 1
          fi
          sha=''
          source=main
          if [ "$BRANCH" != develop ]; then
            # An API failure must fail setup, rather than silently testing main.
            sha=$(gh api --method GET repos/ontola/atomic-saas/pulls \
              -f state=open -f "head=ontola:$BRANCH" -f per_page=100 \
              -q 'map(select(.head.repo.full_name == "ontola/atomic-saas")) | .[0].head.sha // empty')
            if [ -n "$sha" ]; then source='paired open PR'; fi
          fi
          if [ -z "$sha" ]; then
            sha=$(gh api repos/ontola/atomic-saas/commits/main -q .sha)
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$sha" >> "$GITHUB_OUTPUT"
          echo "Cloud Vault source: $sha ($source)"
          {
            echo '### Native recovery revisions'
            echo "Atomic Server: \`$GITHUB_SHA\`"
            echo "Cloud Vault: \`$sha\` ($source)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout the real Cloud Vault implementation
        uses: actions/checkout@v4
        with:
          repository: ontola/atomic-saas
          ref: ${{ steps.saas.outputs.ref }}
          token: ${{ secrets.ATOMIC_SAAS_DISPATCH_TOKEN }}
          path: atomic-saas
          persist-credentials: false

      - name: Build the native recovery test environment
        run: |
          set -euo pipefail
          docker build \
            -f atomic-server/desktop/native-recovery.Dockerfile \
            -t "atomic-native-recovery:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            atomic-server

      - name: Run both native recovery tests unattended
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-recovery-artifacts"
          docker run --rm --init --shm-size=1g \
            -e CI=true \
            -e NATIVE_RECOVERY_ARTIFACT_DIR=/artifacts \
            -v "$GITHUB_WORKSPACE:/code" \
            -v "$RUNNER_TEMP/native-recovery-artifacts:/artifacts" \
            "atomic-native-recovery:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      # The runner copies only sanitized reports/screenshots to this directory.
      # Never upload native profiles, session state, config, or raw process logs.
      - name: Upload native recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-recovery-artifacts/
          if-no-files-found: error
          retention-days: 14
