name: Deployment Staging

# Staging follows `develop`. Production follows a stable `v*` tag, not a
# branch. Same rule otherwise: deploy the commit whose pipeline passed, not
# merely the latest commit. See deploy_production.yml for why `workflow_run`
# rather than `push`, and why the head_sha has to be passed explicitly.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to deploy"
        required: false
        default: develop
        type: string
  # ON HOLD (25 September 2026, Joep's call). Staging used to deploy itself
  # whenever a develop pipeline concluded success. Four consecutive runs then
  # failed on the same step, the pre-swap `./atomic-server export` being
  # OOM-killed on the host (exit 137), and each failure rolled back to an older
  # binary that had never been health-checked. So the automatic path was
  # reliably producing a failed deploy rather than a deployment.
  #
  # `workflow_dispatch` above is untouched: staging can still be deployed by
  # hand, which is the same shape atomic-saas staging was given on
  # 24 September. Restore the trigger below once the export no longer runs the
  # host out of memory.
  #
  # workflow_run:
  #   workflows: ["Main pipeline: build, lint, test"]
  #   branches: ["develop"]
  #   types: [completed]

jobs:
  deploy-staging:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    uses: "./.github/workflows/deployment.yml"
    with:
      environment: staging
      remote_host: staging.atomicdata.dev
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}
    secrets: inherit
