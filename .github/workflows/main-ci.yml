# Reusable Main CI body. Called from main.yml so Mancave and the
# GitHub-hosted fallback share one step list.
#
# Not triggered directly — `workflow_call` only.

on:
  workflow_call:
    inputs:
      runner:
        description: JSON array of runs-on labels, e.g. '["self-hosted","Linux","X64"]'
        type: string
        required: true
      host-profile:
        description: Dagger `--host-profile` — mancave (hot) or hosted (conservative)
        type: string
        required: true
      e2e-mode:
        description: Dagger `--playwright-mode` — light (@smoke) or full (every spec)
        type: string
        required: true
    secrets:
      NETLIFY_TOKEN:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      DAGGER_CLOUD_TOKEN:
        required: true

name: Main CI

jobs:
  ci:
    name: CI
    runs-on: ${{ fromJSON(inputs.runner) }}
    # A full run takes 45 to 75 minutes. Without a limit, a wedged Dagger
    # engine held both Mancave runners for GitHub's 6-hour default
    # (2026-09-25, runs 4587 and 4591). 150 leaves room for a cold cache.
    timeout-minutes: 150
    env:
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Isolate Docker credentials for this job
        shell: bash
        run: |
          # Persistent runners can have desktop-only credential helpers.
          # Keep both registry logins and Dagger on one job-local config.
          docker_config=$(mktemp -d "$RUNNER_TEMP/docker-config.XXXXXX")
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
      # Not for publishing; Dagger
      # pulls `alpine` and the musl-cross images through the host docker
      # config, and an anonymous Docker Hub pull is rate limited per IP; a
      # box that runs CI all day exhausts that.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: joepmeneer
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false
          # The default, ~/setup-pnpm, is shared by every runner on the host.
          # Two jobs installing at once failed with ENOTEMPTY (2026-09-25,
          # run 4596), so each job installs into its own runner's temp dir.
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Install Dagger regression test dependencies
        run: pnpm --dir .dagger install --frozen-lockfile
      - name: Dagger regression tests
        run: pnpm --dir .dagger test
      # Self-hosted checkouts are reused; a previous run's traces must not be
      # uploaded as this run's.
      - name: Clear e2e traces from a previous run
        run: rm -rf e2e-test-results
      - name: Dagger CI (test, lint, build, e2e ${{ inputs.e2e-mode }})
        uses: dagger/dagger-for-github@8.0.0
        with:
          version: "latest"
          # Keep the shared engine up: Mancave runs several jobs at once, and the
          # default stop would kill the engine under a job still using it.
          engine-stop: "false"
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          verb: call
          # `--publish-docs` only from `develop`, the branch production
          # follows (see deploy_staging.yml), so the live docs describe what
          # runs in production. This pipeline previously ran on every push, and
          # netlifyDeploy used to pass `--prod` unconditionally, so a feature
          # branch republished the public docs and typedoc. Tags no longer
          # publish docs: the develop push of the same commit already did.
          # Every other ref gets a preview URL. `--host-profile` selects
          # parallelism (mancave hot / hosted quiet). main.yml's `pick` job
          # chooses the mode: full for develop, tags and trekmeester/combined-*
          # branches, light for other dispatched branches unless overridden.
          # Not `--e2e-mode`: Dagger maps that kebab to `e2EMode` and misses
          # the argument.
          args: --cache-namespace ${{ runner.environment == 'self-hosted' && runner.name || 'hosted' }} ci --netlify-auth-token env://NETLIFY_TOKEN --host-profile ${{ inputs.host-profile }} --playwright-mode ${{ inputs.e2e-mode }} --results-key ${{ github.run_id }}-${{ github.run_attempt }} ${{ github.ref == 'refs/heads/develop' && '--publish-docs' || '' }}
      # Traces, screenshots and page snapshots of failed e2e tests. The `ci`
      # call keeps them in a Dagger cache volume under this run's key (it
      # fails, so it cannot return them); this second call hands them back.
      # Open a trace with `pnpm exec playwright show-trace <trace.zip>` or at
      # trace.playwright.dev.
      - name: Collect e2e traces of failed tests
        if: failure()
        continue-on-error: true
        uses: dagger/dagger-for-github@8.0.0
        with:
          version: "latest"
          engine-stop: "false"
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          verb: call
          args: failed-test-results --results-key ${{ github.run_id }}-${{ github.run_attempt }} export --path e2e-test-results
      - name: Upload e2e traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-${{ github.run_attempt }}
          path: e2e-test-results/
          if-no-files-found: ignore
          retention-days: 14
  # The `:develop` docker image is deliberately NOT a job here. It used to be
  # (`images`, `needs: ci`), and its ~50 minute build then sat on the critical
  # path: staging, production, atomic.place, TestFlight and Play all fire on
  # this pipeline's completion. publish-develop-image.yml now builds it on a
  # `workflow_run` of this pipeline instead, so a green `ci` still gates the
  # image but nothing waits for it.
