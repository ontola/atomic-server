# Reusable Main CI body. Called from main.yml so Mancave and the
# GitHub-hosted fallback share one step list.
#
# Not triggered directly — `workflow_call` only.

on:
  workflow_call:
    inputs:
      runner:
        description: JSON array of runs-on labels, e.g. '["self-hosted","Linux","X64"]'
        type: string
        required: true
      host-profile:
        description: Dagger `--host-profile` — mancave (hot) or hosted (conservative)
        type: string
        required: true
      e2e-mode:
        description: Dagger `--playwright-mode` — light (@smoke) or full (every spec)
        type: string
        required: true
    secrets:
      NETLIFY_TOKEN:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      DAGGER_CLOUD_TOKEN:
        required: true

name: Main CI

jobs:
  ci:
    name: CI
    runs-on: ${{ fromJSON(inputs.runner) }}
    # A full run takes 45 to 75 minutes. Without a limit, a wedged Dagger
    # engine held both Mancave runners for GitHub's 6-hour default
    # (2026-09-25, runs 4587 and 4591). 150 leaves room for a cold cache.
    timeout-minutes: 150
    env:
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Isolate Docker credentials for this job
        shell: bash
        run: |
          # Persistent runners can have desktop-only credential helpers.
          # Keep both registry logins and Dagger on one job-local config.
          docker_config=$(mktemp -d "$RUNNER_TEMP/docker-config.XXXXXX")
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
      # Not for publishing — this job no longer publishes anything. Dagger
      # pulls `alpine` and the musl-cross images through the host docker
      # config, and an anonymous Docker Hub pull is rate limited per IP; a
      # box that runs CI all day exhausts that.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: joepmeneer
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - name: Install Dagger regression test dependencies
        run: pnpm --dir .dagger install --frozen-lockfile
      - name: Dagger regression tests
        run: pnpm --dir .dagger test
      - name: Dagger CI (test, lint, build, e2e ${{ inputs.e2e-mode }})
        uses: dagger/dagger-for-github@8.0.0
        with:
          version: "latest"
          # Keep the shared engine up: Mancave runs several jobs at once, and the
          # default stop would kill the engine under a job still using it.
          engine-stop: "false"
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          verb: call
          # `--publish-docs` only from a stable `v*` tag (no hyphen), matching
          # production. This pipeline previously ran on every push, and
          # netlifyDeploy used to pass `--prod` unconditionally — so a feature
          # branch republished the public docs and typedoc. `master` used to own live
          # docs while the app shipped from tags; both now follow the tag.
          # Every other ref gets a preview URL. `--host-profile` selects
          # parallelism (mancave hot / hosted quiet). Main currently passes
          # full for develop, tags, and dispatched integration batches.
          # Not `--e2e-mode`: Dagger maps that kebab to `e2EMode` and misses
          # the argument.
          args: --cache-namespace ${{ runner.environment == 'self-hosted' && runner.name || 'hosted' }} ci --netlify-auth-token env://NETLIFY_TOKEN --host-profile ${{ inputs.host-profile }} --playwright-mode ${{ inputs.e2e-mode }} ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && '--publish-docs' || '' }}
  # Floating `:develop` image tracks the integration branch. There is no
  # `main` branch here — that clause could never fire, and left in place
  # it invites someone to conclude one exists. `master` is not a docker
  # trigger either. Versioned images are published from tags via the
  # release process (`dagger call create-docker-images --tags …`).
  #
  # Its own job rather than a step at the end of `ci`, since 2026-09-18.
  # As a step it inherited whatever the `ci` step had already spent: when
  # the Dagger engine on the runner was unreachable, `ci` burned the ten
  # minute connect timeout and the publish was skipped without ever
  # trying. It was also unre-runnable on its own, so recovering a missed
  # `:develop` image meant re-running a pipeline that takes hours. As a
  # job it gets a fresh connect and shows up under "Re-run failed jobs".
  # `develop` went three days without an image publish that way.
  #
  # `needs: ci` keeps the gate exactly where it was: a red pipeline still
  # publishes nothing. To publish without waiting for one, run the
  # "Publish :develop image" workflow.
  images:
    name: Docker images
    needs: ci
    if: github.ref == 'refs/heads/develop'
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Isolate Docker credentials for this job
        shell: bash
        run: |
          docker_config=$(mktemp -d "$RUNNER_TEMP/docker-config.XXXXXX")
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
      # Transition period: images publish to BOTH registries. GHCR
      # (org-owned, GITHUB_TOKEN-authenticated, no pull rate limits) is the
      # long-term home; the Docker Hub image stays until users and docs have
      # moved over. Dagger's publish reads the host docker config, so these
      # login steps are what authenticate it.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: joepmeneer
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: |
            joepmeneer/atomic-server
            ghcr.io/ontola/atomic-server
          # The tags land in a dagger `--tags` list argument, which is
          # comma-separated — the default newline separator would split the
          # shell command instead.
          sep-tags: ","
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Dagger docker images (build images & publish)
        uses: dagger/dagger-for-github@8.0.0
        with:
          version: "latest"
          # Keep the shared engine up: Mancave runs several jobs at once, and the
          # default stop would kill the engine under a job still using it.
          engine-stop: "false"
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          verb: call
          args: --cache-namespace ${{ runner.environment == 'self-hosted' && runner.name || 'hosted' }} create-docker-images --tags ${{ steps.meta.outputs.tags }}
