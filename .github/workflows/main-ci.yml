# Reusable Main CI body. Called from main.yml so Mancave and the
# GitHub-hosted fallback share one step list.
#
# Not triggered directly — `workflow_call` only.

on:
  workflow_call:
    inputs:
      runner:
        description: JSON array of runs-on labels, e.g. '["self-hosted","Linux","X64"]'
        type: string
        required: true
      artifact-name:
        description: upload-artifact name (must differ across Mancave / fallback)
        type: string
        required: true
      host-profile:
        description: Dagger `--host-profile` — mancave (hot) or hosted (conservative)
        type: string
        required: true
      e2e-mode:
        description: Dagger `--playwright-mode` — light (@smoke) or full (every spec)
        type: string
        required: true
    secrets:
      NETLIFY_TOKEN:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      DAGGER_CLOUD_TOKEN:
        required: true

name: Main CI

jobs:
  ci:
    name: CI
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Isolate Docker credentials for this job
        shell: bash
        run: |
          # Persistent runners can have desktop-only credential helpers.
          # Keep both registry logins and Dagger on one job-local config.
          docker_config=$(mktemp -d "$RUNNER_TEMP/docker-config.XXXXXX")
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: joepmeneer
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Transition period: images publish to BOTH registries. GHCR
      # (org-owned, GITHUB_TOKEN-authenticated, no pull rate limits) is the
      # long-term home; the Docker Hub image stays until users and docs have
      # moved over. Dagger's publish reads the host docker config, so these
      # login steps are what authenticate it.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: |
            joepmeneer/atomic-server
            ghcr.io/ontola/atomic-server
          # The tags land in a dagger `--tags` list argument, which is
          # comma-separated — the default newline separator would split the
          # shell command instead.
          sep-tags: ","
          # Explicit list so the default preset (schedule/branch/tag/pr) stays
          # exactly as before, plus a full-SHA tag: ontola/atomic-plugins pins
          # its own CI to an exact atomic-server commit (see the TEMPORARY
          # publish gate below) and needs a tag it can compute without
          # querying the API — the commit SHA it already has.
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=long
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - name: Install Dagger regression test dependencies
        run: pnpm --dir .dagger install --frozen-lockfile
      - name: Dagger regression tests
        run: pnpm --dir .dagger test
      - name: Dagger CI (test, lint, build, e2e ${{ inputs.e2e-mode }})
        uses: dagger/dagger-for-github@8.0.0
        with:
          version: "latest"
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          verb: call
          # `--publish-docs` only from a stable `v*` tag (no hyphen), matching
          # production. This pipeline runs on every push, and netlifyDeploy
          # used to pass `--prod` unconditionally — so any feature branch
          # republished the public docs and typedoc. `master` used to own live
          # docs while the app shipped from tags; both now follow the tag.
          # Every other ref gets a preview URL. `--host-profile` selects
          # parallelism (mancave hot / hosted quiet). `--playwright-mode` is
          # light (@smoke) on feature branches and full on develop/tags.
          # Not `--e2e-mode`: Dagger maps that kebab to `e2EMode` and misses
          # the argument.
          args: ci --netlify-auth-token env://NETLIFY_TOKEN --host-profile ${{ inputs.host-profile }} --playwright-mode ${{ inputs.e2e-mode }} ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && '--publish-docs' || '' }}
      - name: Dagger docker images (build images & publish)
        # Floating `:develop` image tracks the integration branch. There is no
        # `main` branch here — that clause could never fire, and left in place
        # it invites someone to conclude one exists. `master` is not a docker
        # trigger either. Versioned images are published from tags via the
        # release process (`dagger call create-docker-images --tags …`).
        #
        # TEMPORARY: also publish from feat/plugin-debug (sha-tagged, via the
        # `type=sha,format=long` tag added above). localthought/atomic-plugins
        # pins its CI to an exact commit on this branch and has no other way
        # to get a running atomic-server without compiling one from source on
        # every run. Remove this `|| ...` clause once the plugin interface
        # stabilizes and atomic-plugins integrates against develop instead.
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/feat/plugin-debug'
        uses: dagger/dagger-for-github@8.0.0
        with:
          version: "latest"
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          verb: call
          args: create-docker-images --tags ${{ steps.meta.outputs.tags }}
      - name: Upload artifacts
        # `always()`: the e2e traces exported above are only interesting when
        # the CI step failed, and without this the upload is skipped exactly
        # then.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ./artifact
          if-no-files-found: ignore
