name: Release-plz

permissions:
  pull-requests: write
  contents: write

# Manual only, on purpose.
#
# This used to trigger on pushes to `main`, a branch this repo does not have —
# so it has never run once, despite holding a CARGO_REGISTRY_TOKEN. Simply
# repointing it at `master` would have switched automated crates.io publishing
# on as a side effect of a branch rename, and the first sign of it would have
# been a release PR nobody asked for.
#
# Releases here are cut deliberately: bump with scripts/bump-version.mjs, tag,
# and let release.yml publish. See CONTRIBUTING.md. Run this by hand if you
# want release-plz to propose the next version instead.
on:
  workflow_dispatch:

jobs:
  release-plz:
    name: Release-plz
    # See main.yml for what CI_RUNNER is and how to switch it off.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && '["ubuntu-latest"]' || (vars.CI_RUNNER || '["ubuntu-latest"]')) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
