name: Release (github, dockerhub, crates.io)

permissions: write-all

on:
  push:
    tags:
      - v*

jobs:
  crates:
    name: Publish crates to crates.io
    # Deliberately NOT CI_RUNNER. Publishing and deploying must not depend on a
    # particular machine being switched on: GitHub does not fall back when a
    # self-hosted runner is offline, it queues for 24h and then fails. A tag
    # push once left crates.io publishing queued for a day for exactly that
    # reason. Self-hosted is for main.yml, where a warm Dagger cache is worth
    # having and a stall only costs slow CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          target: wasm32-unknown-unknown

      # `version: 8` used to be pinned here while browser/package.json declares
      # `packageManager: pnpm@10.15.1`, and there was no Node at all — so this
      # job could not have run a JS build even though, as the next step
      # explains, it has to. There is no root package.json for
      # pnpm/action-setup to read the version from, hence the explicit 10.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      # The published crate has to CONTAIN the built frontend.
      #
      # `atomic-server` embeds the data-browser, and server/Cargo.toml's
      # `include` lists `assets_tmp` for exactly that reason. But assets_tmp is
      # gitignored: it is a build output that `server/build.rs` fills by copying
      # `browser/data-browser/dist` into it. A fresh CI checkout therefore does
      # not have it, and `cargo package` assembles the .crate from what is on
      # disk BEFORE it runs any build script — so publishing straight after
      # checkout produces a crate with no frontend in it.
      #
      # That is not a theoretical concern. Someone running `cargo install
      # atomic-server` has no `browser/` directory, so build.rs cannot rebuild
      # the assets there; it depends on assets_tmp having been shipped. The
      # 0.40.1 crate on crates.io does contain it — because that release was
      # packaged on a machine that happened to have already built the frontend,
      # not because anything here guaranteed it.
      #
      # Copying dist ourselves rather than letting build.rs do it keeps this to
      # a JS build instead of also compiling the whole server (~1460 crates)
      # just to run a build script. The `cargo publish` verification build then
      # finds assets_tmp already present and skips the JS build entirely — it
      # runs from target/package/, where `../browser/` does not exist.
      - name: Build the frontend that gets embedded in the crate
        run: |
          set -euo pipefail
          cd browser
          pnpm install --frozen-lockfile
          pnpm run build
          cd ..
          rm -rf server/assets_tmp
          cp -r browser/data-browser/dist server/assets_tmp
          test -f server/assets_tmp/index.html

      # Runs BEFORE publishing, because crates.io is append-only: a version
      # pushed with (say) browser/lib/package.json still on the previous
      # number cannot be withdrawn, only yanked, and the mismatched pair stays
      # visible forever. The 15 version sites share no single source of truth,
      # so nothing else in this pipeline compares them to the tag.
      - name: Version sites must match the tag
        run: node scripts/bump-version.mjs --check "${GITHUB_REF_NAME#v}"

      # Note the ordering risk this job carries: publish-crates walks the
      # dependency graph, so atomic_lib and atomic-cli go out before
      # atomic-server. A failure on the last one leaves the first two published
      # at a version that can never be reused — crates.io only yanks, it does
      # not delete. Anything that can fail the whole job belongs above this
      # step, not inside it.
      - name: publish crates
        uses: katyo/publish-crates@v1
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # I'd like to skip this one, as the publish-tauri action already creates a release
  create-release:
    name: Create Release on GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: pnpm/action-setup@v2.0.1
        name: Install pnpm
        id: pnpm-install
        with:
          version: 8
          run_install: false

      - uses: taiki-e/create-gh-release-action@v1
        with:
          # (optional)
          changelog: CHANGELOG.md
        env:
          # (required)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          # Currently not supported
          # - windows-latest
    # Deliberately NOT switched to CI_RUNNER: this job exists to build release
    # assets per platform, and the self-hosted runner is Linux/X64 only, so it
    # cannot serve the macos-latest leg. Pinning the whole matrix to it would
    # silently stop producing macOS binaries.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Unlike the `crates` job, this one builds from the full repo, so
      # `server/build.rs` finds `../browser/` and runs the JS build itself
      # rather than reusing a packaged assets_tmp. That needs a working Node
      # toolchain, and the wasm32 target for data-browser's `build:wasm`.
      #
      # It previously had none of that -- pnpm 8 against a repo that declares
      # pnpm 10, no Node, no wasm target -- which is why every release since
      # v0.40.2 died here with `panicked at server/build.rs: js build failed`
      # and shipped no binaries. Checkout now comes first so the setup steps
      # act on a repo that exists.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: wasm32-unknown-unknown
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          # (required)
          bin: atomic-server
          # (optional) On which platform to distribute the `.tar.gz` file.
          # [default value: unix]
          # [possible values: all, unix, windows, none]
          tar: all
          # (optional) On which platform to distribute the `.zip` file.
          # [default value: windows]
          # [possible values: all, unix, windows, none]
          zip: windows
        env:
          # (required)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
