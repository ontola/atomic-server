name: Rust build policy
on:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_rust_alignment.py' -v
      - run: python3 scripts/check-rust-alignment.py
