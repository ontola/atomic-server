name: Flutter embed size
# Builds the browser bundle into the Flutter embed and reports size regressions.
# Split from atomic-flutter.yml so that browser/ changes run only this check.
on:
  pull_request:
    paths: ['browser/**', 'flutter/scripts/build_embed.sh', 'flutter/scripts/check_embed_size.sh', 'flutter/assets/embed/**', '.github/workflows/flutter-embed-size.yml']
  push:
    branches: [develop]
    paths: ['browser/**', 'flutter/scripts/build_embed.sh', 'flutter/scripts/check_embed_size.sh', 'flutter/assets/embed/**', '.github/workflows/flutter-embed-size.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  embed-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the embed
        run: bash flutter/scripts/build_embed.sh
      - name: Report embed size and warn on budget overages
        run: bash flutter/scripts/check_embed_size.sh
