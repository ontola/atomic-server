<!--
  Atomic Canvas — product mark, derived from the Atomic house mark.

  The house mark is the sweep with an orb at its leading end. Canvas keeps
  the sweep but shrinks it (r=19 against the house mark's r=24) to make room
  for a pen, which replaces the orb at the leading end: the pen is drawing
  the stroke. Structure stays identical to the parent — black stroke plus one
  gradient accent in the same #01ECFF -> #2210FF ramp — so the two read as
  one family while staying distinct in monochrome and at 16px.

  The pen tip stops just clear of the arc's round cap, so the two are held
  apart by real geometry rather than relying on the keyline to separate them.

  The white keyline underlaying both is there for contrast, not separation:
  a black arc vanishes on a dark background. See the note in atomic-mark.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" fill="none">
  <!--
    Centres the composition in the viewBox. Drawn at its natural coordinates
    the mark sits high and slightly left — a cramped top edge and a gap
    underneath, obvious once it is masked into an app icon tile. Values are
    measured from the rendered bounding box, not guessed. The gradient is
    horizontal, so the y shift does not disturb it, and the x shift moves
    gradient and pen together.
  -->
  <g transform="translate(1.6,3.9)">
    <path d="M63 60 A 19 19 0 1 1 44 41" stroke="white" stroke-width="21" stroke-linecap="round"/>
    <path
      d="M48.5 36.5 L61.9 33 L77.5 17.4 L67.6 7.5 L52 23.1 Z"
      fill="white"
      stroke="white"
      stroke-width="10"
      stroke-linejoin="round"
    />
    <path d="M63 60 A 19 19 0 1 1 44 41" stroke="black" stroke-width="11" stroke-linecap="round"/>
    <path
      d="M48.5 36.5 L61.9 33 L77.5 17.4 L67.6 7.5 L52 23.1 Z"
      fill="url(#canvasPen)"
    />
  </g>
  <defs>
    <linearGradient id="canvasPen" x1="77.5" y1="30" x2="48.5" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#01ECFF"/>
      <stop offset="1" stop-color="#2210FF"/>
    </linearGradient>
  </defs>
</svg>
