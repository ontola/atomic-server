[package]
name = "atomic-python"
version = "0.1.0"
edition = "2021"
description = "Python bindings for atomic_lib — local-first Atomic Data SDK"
license = "MIT"
publish = false

[lib]
name = "atomic_data"
crate-type = ["cdylib"]

[dependencies]
atomic_lib = { path = "../lib", default-features = false, features = [
    "db-redb",
    "iroh",
    "discovery",
] }
pyo3 = { version = "0.25", features = ["abi3-py39"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
