name: atomic_lib
description: >
  Atomic Data SDK for Flutter — local-first auth, workspaces, sync, and
  reusable UI (pairing, drive switcher, sync settings). Backed by the Rust
  atomic_lib crate via flutter_rust_bridge; no Postgres or server setup required.
version: 0.41.0-beta.2
homepage: https://atomicdata.dev
repository: https://github.com/ontola/atomic-server
issue_tracker: https://github.com/ontola/atomic-server/issues

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.12.0
  http: ^1.3.0
  ed25519_edwards: ^0.3.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
