name: atomic_flutter
description: >
  Atomic Data SDK for Flutter — local-first auth, workspaces, sync, files,
  and reusable UI (pairing, drive switcher, sync settings). Backed by
  atomic_lib via flutter_rust_bridge; no Postgres or server setup required.
version: 0.1.0
publish_to: 'none'
homepage: https://atomicdata.dev
repository: https://github.com/atomicdata-dev/atomic-server

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.12.0
  rust_lib_atomic_flutter:
    path: rust_builder
  http: ^1.3.0
  ed25519_edwards: ^0.3.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
