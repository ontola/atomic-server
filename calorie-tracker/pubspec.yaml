name: calorie_tracker
description: Snap a photo, get a calorie estimate. Local-first, on atomic data.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  rust_lib_calorie_tracker:
    path: rust_builder
  flutter_rust_bridge: ^2.12.0
  http: ^1.3.0
  ed25519_edwards: ^0.3.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  camera: ^0.12.0+2
  flutter_image_compress: ^2.5.1
  path: ^1.9.1
  # OpenRouter's OAuth is PKCE: a SHA-256 challenge (crypto) opened in a system
  # browser that comes back on a custom scheme (flutter_web_auth_2).
  crypto: ^3.0.6
  flutter_web_auth_2: ^5.0.3
  # A `needs-info` meal is the estimator asking something, and the person who
  # could answer has put their phone away — see services/notifications.dart.
  flutter_local_notifications: ^22.2.0
  # The queue, continued after the app is gone: WorkManager on Android, which
  # means it, and BGProcessingTask on iOS, which does not — see
  # services/background_estimation.dart.
  workmanager: ^0.10.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# The launcher icon. `assets/icon/*.svg` is the source; the PNGs beside them are
# rendered from it (`rsvg-convert -w 1024 -h 1024`) and are what this reads.
# Regenerate the platform icons with `dart run flutter_launcher_icons` after
# changing either.
#
# The Android foreground is a separate file rather than the same one scaled: an
# adaptive icon is masked and parallaxed by the launcher, so the mark has to sit
# inside the safe circle, and the background is a flat colour behind it.
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  ios: true
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#2ABB70"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
