name: calorie_tracker
description: Snap a photo, get a calorie estimate. Local-first, on atomic data.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  rust_lib_calorie_tracker:
    path: rust_builder
  flutter_rust_bridge: ^2.12.0
  http: ^1.3.0
  ed25519_edwards: ^0.3.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
