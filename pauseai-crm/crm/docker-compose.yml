# Local development database. `docker compose up -d`, then set
# DATABASE_URL=postgres://postgres:postgres@localhost:5432/pauseai_crm in .env.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pauseai_crm
    ports:
      - '5432:5432'
    volumes:
      - crm-postgres:/var/lib/postgresql/data
volumes:
  crm-postgres:
