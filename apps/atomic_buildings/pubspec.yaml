name: atomic_buildings
description: A digital twin of a house on Atomic Data, with the questions an AI asks.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  atomic_store:
    path: ../../packages/atomic_store
  atomic_store_flutter:
    path: ../../packages/atomic_store_flutter
  atomic_chat:
    path: ../../packages/atomic_chat
  atomic_flutter:
    path: ../../packages/atomic_flutter
  ed25519_edwards: ^0.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  http: ^1.2.0

flutter:
  uses-material-design: true
