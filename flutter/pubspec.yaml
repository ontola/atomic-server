name: atomic_app
description: atomic.place

publish_to: 'none'

# Release version without the pre-release suffix (iOS accepts only x.y.z);
# scripts/bump-version.mjs keeps it in step with the repo version. The part
# after `+` is the build number, which must keep increasing in App Store
# Connect (TestFlight is at 13).
version: 0.41.0+14

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  atomic_chat:
    path: ../packages/atomic_chat
  atomic_flutter:
    path: ../packages/atomic_flutter
  atomic_store:
    path: ../packages/atomic_store
  atomic_store_flutter:
    path: ../packages/atomic_store_flutter
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  flutter_rust_bridge: 2.12.0
  http: ^1.3.0
  ed25519_edwards: ^0.3.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.0
  file_selector: ^1.1.0
  share_plus: ^12.0.2
  # Peer links with the browser: the data channel and the signalling socket.
  flutter_webrtc: ^1.0.0
  web_socket_channel: ^3.0.3
  crypto: ^3.0.6

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # The embedded renderer, built by scripts/build_embed.sh; atomic_chat's
    # EmbedServer serves it from here (EmbedServer.assetRoot).
    - assets/embed/
    - assets/embed/assets/
