[package]
authors = ["joep@ontola.io"]
build = "src/build.rs"
description = "Atomic Server - Tauri desktop"
edition = "2021"
license = "MIT"
name = "atomic-server-tauri"
repository = "https://github.com/atomicdata-dev/atomic-server"
version = "0.41.0-beta.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
actix-rt = "2.6.0"
clap = "4"
serde_json = "1.0"
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-deep-link = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"

# Mobile-only: the in-app QR scanner for device pairing. The Android WebView
# doesn't grant getUserMedia to web content, so a web BarcodeDetector scanner
# can't work — this native scanner owns the camera + permission instead.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# Desktop-only: the NFS "virtual drive" mount. Neither mobile OS can mount NFS
# (they use provider APIs instead — see planning/virtual-drive.md), so this is
# gated off android/ios. `nfsserve` runs a local NFS v3 server the OS mounts.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
nfsserve = "0.10"
hex = "0.4"
blake3 = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dependencies.atomic-server]
# No HTTPS for desktop, but include Iroh for p2p sync
default-features = false
path = "../server"

[dependencies.atomic_lib]
path = "../lib"
features = ["db-redb", "iroh"]

[dependencies.serde]
features = ["derive"]
version = "1.0"

# reqwest's rustls backend delegates certificate verification to the Android
# system trust store; that bridge must be initialized with the app's JVM
# context at startup (see lib.rs) or every outbound HTTPS request panics.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "0.7"
# Android reports its hostname as "localhost"; the real device name lives in
# the system properties (see `android_device_name` in lib.rs).
android_system_properties = "0.1"

[lib]
name = "atomic_server_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "atomic-server-tauri"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
